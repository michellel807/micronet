version: '3'
services:

  db:
    image: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      # POSTGRES_DB: mydb
      # POSTGRES_USER: myuser
      POSTGRES_PASSWORD: micronet_app_password

  web:
    build:
      context: ./
      dockerfile: Dockerfile
    env_file:
      - .env
    command: rails server -b 0.0.0.0
    volumes:
      - bundle:/bundle
      - .:/app
    ports:
      - "3000:3000"
    depends_on:
      - db
      - delayed_job
      - smtp

  delayed_job:
    build:
      context: ./
      dockerfile: Dockerfile
    env_file:
      - .env
    command: rake jobs:work
    volumes:
      - .:/app
      - bundle:/bundle
    depends_on:
      - db
      - smtp
  smtp:
    image: inbucket/inbucket
    ports:
      - "9000:9000"
      - "2500:2500"
      - "1100:1100"

volumes:
  postgres-data:
  bundle:

