version: '3'
services:

  db:
    image: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: password

  web:
    build:
      context: ./
      dockerfile: Dockerfile
    command: rails server -b 0.0.0.0
    volumes:
      - bundle:/bundle
      - .:/app
    ports:
      - "3000:3000"
    depends_on:
      - db

  delayed_job:
    build:
      context: ./
      dockerfile: Dockerfile
    command: rake jobs:work
    volumes:
      - .:/app
      - bundle:/bundlei
    depends_on:
      - db

volumes:
  postgres-data:
  bundle:

