version: '3'
services:
  postgres:
    build:
      context: ./
      dockerfile: Dockerfile.db
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  webapp:
    build:
      context: ./
      dockerfile: Dockerfile.app
    command: rails server -b 0.0.0.0
    ports:
      - "3000:3000"
    depends_on:
      - postgres

volumes:
  postgres-data:

