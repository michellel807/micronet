
services:

  db:
    image: postgres:16
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

  web:
    build:
      context: ./
      dockerfile: Dockerfile
      target: deps
    env_file:
      - .env
    command: rails server -b 0.0.0.0
    volumes:
      - bundle:/bundle
      - .:/app
    ports:
      - "3000:3000"
    depends_on:
      - db
      - delayed_job
      - local-email

  delayed_job:
    build:
      context: ./
      dockerfile: Dockerfile
      target: deps
    env_file:
      - .env
    command: rake jobs:work
    volumes:
      - .:/app
      - bundle:/bundle
    depends_on:
      - db
      - local-email

  local-email:
    image: inbucket/inbucket
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:2500:2500"
      - "127.0.0.1:1100:1100"
    volumes:
      - inbucket-storage:/storage

  test:
    build:
      context: ./
      dockerfile: Dockerfile
      target: deps
    env_file:
      - .env
    command: ["rails", "test"] # or `rails test` if using Minitest
    volumes:
      - .:/app
      - bundle:/bundle
    depends_on:
      - db
      - local-email

  nginx-proxy:
    # Server HTTPS proxy; local development uses http://localhost:3000.
    profiles: ["server"]
    image: nginx:alpine
    container_name: nginx_reverse_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt/live/micronet-01.oit.duke.edu:/etc/letsencrypt/live/micronet-01.oit.duke.edu:ro
      - /etc/letsencrypt/archive/micronet-01.oit.duke.edu:/etc/letsencrypt/archive/micronet-01.oit.duke.edu:ro

volumes:
  letsencrypt:
    external: true
  postgres-data:
  bundle:
  inbucket-storage:

