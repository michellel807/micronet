events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Redirect all HTTP traffic to HTTPS
    server {
        listen 80;
        server_name micronet-01.oit.duke.edu;
        return 301 https://$host$request_uri;
    }

    # Main HTTPS Reverse Proxy
    server {
        listen 443 ssl;
        server_name micronet-01.oit.duke.edu;

        # Let's Encrypt Certificates mounted from the host
        ssl_certificate /etc/letsencrypt/live/micronet-01.oit.duke.edu/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/micronet-01.oit.duke.edu/privkey.pem;

        # Recommended SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            # Change this if your port 3000 service is in another container or on the host machine
            # Example: http://docker.internal; if app is on the host
            # Example: http://app_service_name:3000; if app is in the same Docker network
            proxy_pass http://web:3000; 
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

