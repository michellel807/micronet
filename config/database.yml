default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  url: <%= ENV.fetch("DATABASE_URL", "postgresql://localhost/micronet_development") %>

test:
  <<: *default
  url: <%= ENV.fetch("TEST_DATABASE_URL", "postgresql://localhost/micronet_test") %>

production:
  <<: *default
  url: <%= ENV.fetch("DATABASE_URL", "postgresql://localhost/micronet_production") %>
